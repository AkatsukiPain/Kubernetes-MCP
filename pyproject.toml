[project]
name = "kubernetes-mcp"
version = "0.1.0"
description = "MCP server for direct Kubernetes API access with RBAC-backed auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "mcp[cli]>=1.2.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
  "starlette>=0.27.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
kubernetes-mcp = "kubernetes_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
